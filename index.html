<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7EAE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1215" media="(prefers-color-scheme: dark)">
<title>Investigatoren-Akte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Limelight&display=swap" rel="stylesheet">
<style>
/* Layout: Akten-Werkbank — Schrittleiste links, Arbeitsfläche Mitte, laufender Bogen rechts */
:root{
  --bg:#E7EAE4; --surface:#F5F6F2; --sunk:#DDE3DD; --ink:#1A2130; --muted:#586170; --line:#C3C9C0;
  --accent:#2A665E; --accent-ink:#F3F7F5; --accent-soft:#D3E2DD; --blood:#8C2D2A; --ok:#2E6A3B;
  --display:"Limelight","Didot","Bodoni 72",Georgia,serif;
  --head:"Cormorant Garamond","Garamond","Times New Roman",serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1215; --surface:#161C20; --sunk:#1D2529; --ink:#E1E5E0; --muted:#97A1A6; --line:#2C363C;
  --accent:#6AB0A3; --accent-ink:#0E1215; --accent-soft:#1F3532; --blood:#E07A72; --ok:#7DC18B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#161C20; --sunk:#1D2529; --ink:#E1E5E0; --muted:#97A1A6; --line:#2C363C;
  --accent:#6AB0A3; --accent-ink:#0E1215; --accent-soft:#1F3532; --blood:#E07A72; --ok:#7DC18B; color-scheme:dark}

[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:1150px){input,select,textarea{font-size:16px}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.shell{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-block:24px 14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,44px);line-height:1;margin:6px 0 0;letter-spacing:.02em}
.switch{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.switch select{min-width:0;max-width:260px}
.savestate{font-family:var(--mono);font-size:11px;color:var(--muted);width:100%;text-align:right}

/* Formularelemente */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:7px 9px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.45}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input:disabled{opacity:.5}
label{display:block}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:7px 14px;font-weight:500;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--blood);color:var(--blood)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.di{width:15px;height:15px;flex:none}
.rollnote{font-family:var(--mono);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* Raster */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 290px;gap:28px;align-items:start}
@media (max-width:1150px){.app{grid-template-columns:190px minmax(0,1fr)}}
@media (max-width:780px){.app{grid-template-columns:minmax(0,1fr);gap:18px}}

/* Schrittleiste */
#steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
#steps button{display:grid;grid-template-columns:26px 1fr 10px;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:3px;padding:8px 8px;font-size:14px}
#steps button:hover{background:var(--sunk)}
#steps button[aria-current="step"]{background:var(--ink);color:var(--bg)}
#steps .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
#steps button[aria-current="step"] .no{color:inherit;opacity:.7}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.warn{background:var(--blood);border-color:var(--blood)}
@media (max-width:780px){
  #steps ol{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px;scrollbar-width:thin}
  #steps li{flex:0 0 auto}
  #steps button{grid-template-columns:auto auto auto;white-space:nowrap}
}

/* Hauptfläche */
main{min-width:0}
.stephead{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.stephead .no{font-family:var(--mono);color:var(--muted);font-size:13px}
.stephead h2{font-family:var(--head);font-weight:600;font-size:clamp(28px,3.4vw,38px);line-height:1.05;margin:0}
.lede{max-width:66ch;color:var(--muted);margin:4px 0 20px}
.block{margin-block:22px}
.block h3{font-family:var(--head);font-weight:600;font-size:22px;margin:0 0 8px}
.rule{background:var(--sunk);border-top:1px dashed var(--muted);padding:12px 16px 14px;margin-block:20px;font-size:14px;max-width:72ch}
.rule-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.rule p{margin:0 0 6px}.rule p:last-child{margin:0}
.rule ul,.rule ol{margin:4px 0 0;padding-left:20px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.form-grid input{width:100%}
.note{font-size:13px;color:var(--muted)}
.warnline{color:var(--blood);font-size:13.5px}
.okline{color:var(--ok);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Methodenwahl */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid var(--blood);border-radius:3px;font-size:14px}

/* Eigenschaftskarten */
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.ccard-h{display:flex;align-items:baseline;gap:8px}
.abbr{font-family:var(--head);font-weight:700;font-size:26px;line-height:1}
.cname{font-size:13.5px;color:var(--muted)}
.ccard-f{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ccard-v{display:flex;gap:8px;align-items:center}
.ccard-v input,.ccard-v select{width:76px;font-size:20px;padding:4px 8px}
.hf{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cdesc{font-size:12.5px;color:var(--muted);margin:0;line-height:1.35}
.dice{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:22px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.die{display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:4px;color:var(--ink);font-weight:600;font-size:12px}
.die.d10{border-radius:50%}
.die.d100{width:auto;padding:0 5px}
.counter{display:inline-flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:8px 14px}
.counter b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;font-weight:600}
.counter span{font-size:13px;color:var(--muted)}
.neg{color:var(--blood)!important}
.sticky-counter{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Tabellen */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.val{font-weight:600;font-size:15px}
tr.over td.val{color:var(--blood)}
tr.hl td{background:var(--accent-soft)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper input{width:62px;text-align:right;padding:4px 6px}
.stepper button{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);border-radius:3px;line-height:1;padding:0}
.stepper button:hover{border-color:var(--accent)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:2px;padding:0 4px;margin-left:6px;vertical-align:1px}
.x{background:none;border:0;color:var(--muted);padding:0 4px;font-size:15px}
.x:hover{color:var(--blood)}

/* Berufe */
.occgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.occbtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.occbtn:hover{border-color:var(--accent)}
.occbtn strong{font-family:var(--head);font-size:19px;font-weight:600;line-height:1.1}
.occbtn span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.occdetail{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px 18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0 16px}
.fact .lbl{margin-bottom:2px}
.fact b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slots li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;padding-top:8px;border-top:1px solid var(--line)}
.slots .sn{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.slots .picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.slots select{max-width:100%}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick input{width:180px}

/* Alter */
.bands{width:100%}
.bands td{font-size:13.5px}
.dedrow{display:grid;grid-template-columns:minmax(120px,1fr) 60px auto 60px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dedrow:last-child{border-bottom:0}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Hintergrund */
.backgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.bfield{display:flex;flex-direction:column;gap:6px}
.bfield-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.keyc{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}

/* Finanzen */
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}

/* Seitenleiste */
#side{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.sheetcard{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.sheetcard h3{font-family:var(--head);font-size:22px;font-weight:600;margin:0;line-height:1.1}
.sub{font-size:13px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;margin-top:12px}
.mini div{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:3px;padding:4px 0}
.mini small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.mini b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.derived{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:12px;font-size:13.5px}
.derived div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding-block:3px}
.derived b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.toplist{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.toplist li{display:flex;justify-content:space-between;padding-block:2px}
.toplist b{font-family:var(--mono)}

/* Bogen */
.sheet{background:var(--surface);border:1px solid var(--ink);border-radius:2px;padding:20px clamp(14px,3vw,28px)}
.sheet-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.sheet-h h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:0;line-height:1.05}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 18px;font-size:14px}
.kv span{color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-block:12px}
.sbox{border:1px solid var(--line);border-radius:2px;padding:6px 8px;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}
.sbox .abbr{font-size:22px;grid-row:span 2}
.sbox b{font-family:var(--mono);font-size:19px;text-align:right}
.sbox small{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.skillcols{columns:3 230px;column-gap:24px;font-size:13.5px}
.sk{display:flex;gap:6px;align-items:baseline;break-inside:avoid;padding-block:2px;border-bottom:1px dotted var(--line)}
.sk .n{flex:1;min-width:0}
.sk .v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sk .v small{color:var(--muted)}
.sk.up .n,.sk.up .v b{font-weight:600}
.backlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 22px;font-size:14px}
.backlist p{margin:2px 0 0;white-space:pre-wrap}
.issues{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.issues li{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:14px}
.exportbox{font-family:var(--mono);font-size:12px;min-height:140px}
.transfer{background:var(--surface);border:1px solid var(--ink);border-radius:3px;padding:16px 18px 18px;margin:-8px 0 24px}
.transfer-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.transfer-h h2{font-family:var(--head);font-weight:600;font-size:26px;margin:0}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px 28px;margin-top:12px}
.tcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tcol h3{font-family:var(--head);font-weight:600;font-size:21px;margin:0}
.scope{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.scope label{display:inline-flex;align-items:center;gap:6px}
.drop{border:1.5px dashed var(--line);border-radius:3px;padding:14px;text-align:center;font-size:13.5px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.tmsg{font-size:13.5px;min-height:1.4em}
.tmsg.err{color:var(--blood)}.tmsg.ok{color:var(--ok)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.modeseg button{padding:5px 14px;font-weight:500}

/* Spielansicht */
.play{display:flex;flex-direction:column;gap:22px;padding-bottom:200px}
.ptop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 24px}
.ptop h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.6vw,38px);line-height:1.05;margin:2px 0 0}
.trackers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
@media (max-width:620px){.trackers{grid-template-columns:1fr 1fr;gap:8px}.trk{padding:10px}.trk-v{font-size:28px}.trk-ctl input{width:58px}.trk .btn.small{padding:4px 8px}}
.trk{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.trk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trk-h .lbl{margin:0}
.trk-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:36px;font-weight:600;line-height:1}
.trk-v small{font-size:16px;color:var(--muted);font-weight:400}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.bar.low i{background:var(--blood)}
.trk-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trk-ctl input{width:68px;padding:5px 7px}
.trk .note{font-size:12.5px;margin:0}
.hint{font-size:13px;border-left:3px solid var(--blood);padding:4px 0 4px 10px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;background:transparent}
.chip:hover{border-color:var(--blood)}
.chip[aria-pressed="true"]{background:var(--blood);border-color:var(--blood);color:var(--surface)}
.rollbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.rollbar .seg button{padding:5px 11px;font-size:13.5px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:920px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pcol{display:flex;flex-direction:column;gap:22px;min-width:0}
.psec h3{font-family:var(--head);font-weight:600;font-size:23px;margin:0 0 8px}
.cbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.cbtn{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 9px}
.cbtn:hover{border-color:var(--accent)}
.cbtn .abbr{font-size:20px}
.cbtn b{font-family:var(--mono);font-size:17px;text-align:right}
.cbtn small{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}

function charsIssues(){const out=[];const missing=ORDER.filter(k=>C.base[k]==null||C.base[k]==='');
 if(missing.length)out.push(`Es fehlen noch ${missing.length} Eigenschaft${missing.length>1?'en':''} (${missing.map(k=>CH[k].a).join(', ')}).`);
 if(C.method==='points'){const sum=ORDER.reduce((s,k)=>s+(+C.base[k]||0),0);if(!missing.length&&sum!==POINTBUY)out.push(`Punktekauf: ${sum} statt ${POINTBUY} Punkte verteilt.`);
  ORDER.forEach(k=>{const v=C.base[k];if(v==null)return;const min=TWO.includes(k)?40:15;if(v<min||v>90)out.push(`${CH[k].a} muss zwischen ${min} und 90 liegen.`)})}
 if(C.luck[0]==null)out.push('Glück ist noch nicht gewürfelt.');return out}
function ageIssues(){const out=[];const B=band(C.age);const a=+C.age;if(!(a>=15&&a<=89))out.push('Das Alter muss zwischen 15 und 89 liegen.');
 if(B.ded&&dedSum()!==B.ded)out.push(`Altersabzug: ${dedSum()} von ${B.ded} Punkten verteilt.`);
 B.keys.forEach(k=>{const v=final(k);if(v!=null&&v<1)out.push(`${CH[k].a} darf nicht unter 1 fallen.`)});
 if(B.checks){const done=C.eduChecks.slice(0,B.checks).filter(Boolean).length;if(done<B.checks)out.push(`Noch ${B.checks-done} Bildungs-Steigerungsprobe${B.checks-done>1?'n':''} offen.`)}
 if(B.youth&&C.luck[0]!=null&&C.luck[1]==null)out.push('Jugendliche würfeln Glück ein zweites Mal.');return out}
function occIssues(){const out=[];if(!OCC[C.occ]){out.push('Noch kein Beruf gewählt.');return out}
 slots().forEach((sl,i)=>{if(sl.fixed)return;const p=C.occPick[i]||[];for(let j=0;j<sl.n;j++)if(!validPick(p[j])){out.push('Nicht alle Berufsfertigkeiten sind ausgewählt.');return}});
 const d=occDupes();if(d.length)out.push(`Doppelt gewählt: ${d.map(skillName).join(', ')}.`);
 if(OCC[C.occ].custom&&!C.occName.trim())out.push('Gib deinem eigenen Beruf einen Namen.');
 return[...new Set(out)]}
function occSkillIssues(){const out=[];if(!OCC[C.occ])return['Wähle zuerst einen Beruf.'];
 const r=occTotal()-occSpent();if(r>0)out.push(`${r} Berufspunkte sind noch nicht verteilt.`);if(r<0)out.push(`${-r} Berufspunkte zu viel verteilt.`);
 const cr=skillVal('finanzkraft'),[a,b]=crRange();if(cr<a||cr>b)out.push(`Finanzkraft ${cr} liegt außerhalb der Spanne ${a}–${b}.`);
 occKeyList().forEach(k=>{if(skillVal(k)>99)out.push(`${skillName(k)} liegt über 99.`)});return[...new Set(out)]}
function persIssues(){const out=[];const r=persTotal()-persSpent();if(r>0)out.push(`${r} Interessenpunkte sind noch nicht verteilt.`);if(r<0)out.push(`${-r} Interessenpunkte zu viel verteilt.`);
 if(+C.persPts.mythos)out.push('Cthulhu-Mythos kann bei der Erschaffung nicht gesteigert werden.');
 const cr=skillVal('finanzkraft'),[a,b]=crRange();if(OCC[C.occ]&&(cr<a||cr>b))out.push(`Finanzkraft ${cr} liegt außerhalb der Spanne ${a}–${b}.`);
 instances().forEach(k=>{if(skillVal(k)>99)out.push(`${skillName(k)} liegt über 99.`)});return[...new Set(out)]}
function stepIssues(i){switch(STEPS[i].id){
 case'person':return C.info.name.trim()?[]:['Der Investigator braucht noch einen Namen.'];
 case'chars':return charsIssues();
 case'age':return allFinal()||C.base.EDU!=null?ageIssues():['Lege zuerst die Eigenschaften fest.'];
 case'occ':return occIssues();
 case'occskills':return occSkillIssues();
 case'pers':return persIssues();
 case'back':{const n=BACK.filter(b=>C.back[b.k]&&C.back[b.k].trim()).length;return n>=3?[]:['Fülle mindestens drei Hintergrund-Felder aus (empfohlen).']}
 case'money':return OCC[C.occ]?[]:['Ergibt sich aus der Finanzkraft – wähle zuerst einen Beruf.'];
 default:return[]}}
function stepState(i){if(STEPS[i].id==='sheet'){for(let j=0;j<STEPS.length-1;j++)if(stepIssues(j).length)return'todo';return'done'}
 const is=stepIssues(i);if(!is.length)return'done';
 const bad=is.some(t=>/zu viel|über 99|außerhalb|Doppelt|muss zwischen|nicht unter|nicht gesteigert/.test(t));return bad?'warn':'todo'}

function field(path,label,ph,type='text'){const v=path.split('.').reduce((o,k)=>o?.[k],C);const id='f-'+path.replace(/\./g,'-');

function stepPerson(){return`<p class="lede">Dieser Builder führt dich durch die Erschaffung eines Investigators nach den Regeln der 7. Edition. Jeder Schritt erklärt die Regel, würfelt und rechnet für dich mit. Den aktuellen Stand zeigt dir jederzeit der laufende Bogen – auf großen Bildschirmen rechts, auf Handy und Tablet über „Bogen ansehen“.</p>
 <div class="row" style="margin-bottom:16px"><button class="btn" data-act="randAll">${DI} Kompletten Investigator würfeln</button><button class="btn ghost" data-act="randPerson">${DI} Personalien würfeln</button></div>

  ${ui.eraConfirm?`<div class="confirm"><span>Beim Wechsel zu „${ERA[ui.eraConfirm]}“ wird entfernt, was es dort nicht gibt: ${esc(eraConflicts(ui.eraConfirm).join(', '))}.</span><button class="btn small danger" data-act="eraYes">Wechseln</button><button class="btn small ghost" data-act="eraNo">Abbrechen</button></div>`:''}</div>
 <div class="form-grid">

  ${field('info.player','Spieler/in','Dein Name')}
  ${field('info.gender','Geschlecht','')}
  ${field('info.residence','Wohnort','z. B. Arkham, Massachusetts')}
  ${field('info.birthplace','Geburtsort','z. B. Bremen')}
 </div>
 ${rule('Ablauf',`<p>Ein Investigator entsteht in dieser Reihenfolge:</p><ol>
  <li><b>Eigenschaften</b> würfeln oder verteilen, dazu Glück.</li>
  <li><b>Alter</b> wählen: Es verändert Eigenschaften, Bildung und Bewegung.</li>

  <li><b>Interessenpunkte</b> (IN × 2) auf beliebige Fertigkeiten verteilen.</li>
  <li><b>Hintergrund</b> und <b>Besitz</b> festhalten.</li></ol>
  <p>Abgeleitete Werte wie Trefferpunkte oder Schadensbonus berechnet der Builder automatisch.</p>`)}
 ${rule('Epoche',`<p>Die Regeln sind in beiden Epochen gleich. In der Gegenwart kommen die Fertigkeiten <b>Computernutzung</b> (5 %) und <b>Elektronik</b> (1 %) hinzu, außerdem Berufe der heutigen Zeit. Die Finanzkraft wird in heutigen Dollar umgerechnet.</p>`)}`}

 const seg=`<div class="seg" role="group" aria-label="Methode">${[['roll','Würfeln'],['array','Feste Werte verteilen'],['points','Punkte kaufen']].map(([k,t])=>`<button data-act="method" data-m="${k}" aria-pressed="${m===k}">${t}</button>`).join('')}</div>`;

 if(m==='roll'){intro=`<div class="row" style="margin-top:14px"><button class="btn" data-act="rollAll">${DI} Alle Eigenschaften würfeln</button><span class="note">Oder echte Würfelergebnisse direkt eintragen.</span></div>`;
  cards=ORDER.map(k=>{const r=C.rolls[k];return`<div class="ccard">

   <div class="ccard-v"><input type="number" id="c-${k}" data-char="${k}" min="1" max="99" inputmode="numeric" value="${C.base[k]??''}" aria-label="${CH[k].n}"><button class="btn small ghost" data-act="roll" data-k="${k}" aria-label="${CH[k].n} würfeln">${DI}<span class="bl"> Würfeln</span></button></div>

 if(m==='array'){intro=`<p class="note" style="margin-top:14px">Verteile die Werte 80, 70, 60, 60, 50, 50, 50 und 40 – jeder Wert genau einmal.</p>`;
  const used={};ORDER.forEach(k=>{if(C.base[k]!=null)used[C.base[k]]=(used[C.base[k]]||0)+1});
  const avail={};ARRAY.forEach(v=>avail[v]=(avail[v]||0)+1);
  cards=ORDER.map(k=>`<div class="ccard"><div class="ccard-h"><span class="abbr">${CH[k].a}</span><span class="cname">${CH[k].n}</span></div>
   <div class="ccard-v"><select id="a-${k}" data-sel="arr" data-k="${k}" aria-label="${CH[k].n}"><option value="">–</option>${[80,70,60,50,40].map(v=>{const left=avail[v]-(used[v]||0);const mine=C.base[k]===v;return`<option value="${v}"${mine?' selected':''}${!mine&&left<=0?' disabled':''}>${v}${!mine&&left>0&&avail[v]>1?` (${left}×)`:''}</option>`}).join('')}</select></div>
   <div class="hf">½ <span data-live="bh:${k}"></span> · ⅕ <span data-live="bf:${k}"></span></div><p class="cdesc">${CH[k].d}</p></div>`).join('')}
 if(m==='points'){intro=`<div class="row" style="margin-top:14px"><div class="counter"><b data-live="pb-rem" data-sign></b><span>von ${POINTBUY} Punkten übrig</span></div><span class="note">Jede Eigenschaft 15–90; GR, IN und BI mindestens 40.</span></div>`;
  cards=ORDER.map(k=>{const min=TWO.includes(k)?40:15;return`<div class="ccard"><div class="ccard-h"><span class="abbr">${CH[k].a}</span><span class="cname">${CH[k].n}</span></div>
   <div class="ccard-f">${min}–90</div>
   <div class="ccard-v stepper"><button data-act="cstep" data-k="${k}" data-d="-5" aria-label="${CH[k].a} −5">−</button><input type="number" id="p-${k}" data-char="${k}" min="${min}" max="90" step="5" inputmode="numeric" value="${C.base[k]??''}" aria-label="${CH[k].n}"><button data-act="cstep" data-k="${k}" data-d="5" aria-label="${CH[k].a} +5">+</button></div>
   <div class="hf">½ <span data-live="bh:${k}"></span> · ⅕ <span data-live="bf:${k}"></span></div><p class="cdesc">${CH[k].d}</p></div>`}).join('')}
 const ld=C.luckDice[0];
 const luckCard=`<div class="block"><h3>Glück</h3><div class="ccard" style="max-width:340px">
   <div class="ccard-f">3W6 × 5 · wird bei jeder Methode gewürfelt</div>
   <div class="ccard-v"><input type="number" id="luck0" data-luck="0" min="1" max="99" inputmode="numeric" value="${C.luck[0]??''}" aria-label="Glück"><button class="btn small ghost" data-act="rollLuck" data-i="0">${DI} Würfeln</button></div>
   <div class="dice">${ld?dice(ld,'d6',ui.fresh==='luck0')+' → ×5':''}</div></div></div>`;
 return`<p class="lede">Acht Eigenschaften beschreiben Körper und Geist deines Investigators. Jeder Wert wird in drei Stufen genutzt: normal, schwierig (½) und extrem (⅕).</p>
 ${seg}${confirm}${intro}<div class="chars" style="margin-top:14px">${cards}</div>${luckCard}
 ${rule('Eigenschaften',`<p><b>Würfeln:</b> ST, KO, GE, ER und MA mit 3W6 × 5; GR, IN und BI mit (2W6 + 6) × 5.</p><p><b>Feste Werte:</b> 80, 70, 60, 60, 50, 50, 50, 40 frei zuordnen.</p><p><b>Punkte kaufen:</b> ${POINTBUY} Punkte verteilen, jeweils 15–90.</p><p>Ob schlechte Würfe wiederholt werden dürfen, entscheidet die Spielleitung.</p>`)}`}

function stepAge(){const B=band(C.age);
 if(C.base.EDU==null&&!allFinal())return`<p class="lede">Lege zuerst die Eigenschaften fest. Das Alter verändert sie danach.</p><button class="btn" data-act="go" data-i="1">Zu den Eigenschaften</button>`;
 const bandRows=BANDS.map(([from,l,a,e,x])=>`<tr class="${l===B.lbl?'hl':''}"><td class="num">${l}</td><td>${a}</td><td>${e}</td><td>${x||'–'}</td></tr>`).join('');
 let ded='';
 if(B.ded){ded=`<div class="block"><h3>Altersabzüge</h3><p class="note">Ziehe insgesamt <b>${B.ded}</b> Punkte von ${B.keys.map(k=>CH[k].n).join(B.keys.length>2?', ':' und ').replace(/, ([^,]*)$/,' und $1')} ab – frei verteilt.</p>
  <div class="row" style="margin:8px 0"><div class="counter"><b data-live="ded-rem" data-sign></b><span>Punkte noch abzuziehen</span></div><button class="btn small ghost" data-act="dedEven">Gleichmäßig verteilen</button><button class="btn small ghost" data-act="dedRand">${DI} Zufällig verteilen</button></div>
  <div class="tablewrap" style="padding:4px 12px">${B.keys.map(k=>`<div class="dedrow"><span><b>${CH[k].a}</b> ${CH[k].n}</span><span class="num note">${C.base[k]??'–'}</span>
   <span class="stepper"><button data-act="dstep" data-k="${k}" data-d="-1" aria-label="Abzug verringern">−</button><input type="number" id="d-${k}" data-ded="${k}" min="0" value="${C.ageDed[k]||0}" inputmode="numeric" aria-label="Abzug ${CH[k].n}"><button data-act="dstep" data-k="${k}" data-d="1" aria-label="Abzug erhöhen">+</button></span>
   <span class="num"><b data-live="c:${k}"></b></span></div>`).join('')}</div></div>`}
 const app=B.app?`<p>Erscheinung sinkt um ${B.app}: <b>${C.base.APP??'–'}</b> → <b>${final('APP')??'–'}</b>.</p>`:'';
 const youth=B.youth?`<p>Bildung sinkt um 5: <b>${C.base.EDU??'–'}</b> → <b>${final('EDU')??'–'}</b>.</p>`:'';
 let checks='';
 if(B.checks){const rows=[];for(let i=0;i<B.checks;i++){const c=C.eduChecks[i];
  if(c)rows.push(`<div class="check"><span class="note">Probe ${i+1}</span><span class="die d100">${c.roll}</span><span>gegen BI ${eduBefore(i)}</span><span>${c.gain?`<b class="okline">Erfolg: +${c.gain}</b> (1W10)`:'kein Anstieg'}</span></div>`);
  else if(i===C.eduChecks.length)rows.push(`<div class="check"><span class="note">Probe ${i+1}</span><button class="btn small" data-act="eduCheck">${DI} W100 würfeln</button>${B.checks-i>1?`<button class="btn small ghost" data-act="eduAll">Alle restlichen würfeln</button>`:''}<span class="note">Liegt der Wurf über BI ${eduBefore(i)}, steigt BI um 1W10.</span></div>`)}
  checks=`<div class="block"><h3>Bildungs-Steigerungsproben</h3><p class="note">In deinem Alter stehen dir ${B.checks} Probe${B.checks>1?'n':''} zu. Bildung kann dabei nicht über 99 steigen.</p><div class="checks">${rows.join('')}</div>
  ${C.eduChecks.length?`<p style="margin-top:8px">Bildung jetzt: <b data-live="c:EDU"></b> <button class="linkbtn" data-act="eduReset">Proben zurücksetzen</button></p>`:''}</div>`}
 const youthLuck=B.youth?`<div class="block"><h3>Zweiter Glückswurf</h3><p class="note">Jugendliche würfeln Glück zweimal und behalten den höheren Wert.</p>
  <div class="row"><span>1. Wurf: <b>${C.luck[0]??'–'}</b></span><span>2. Wurf:</span><input type="number" id="luck1" data-luck="1" style="width:76px" value="${C.luck[1]??''}" aria-label="Zweiter Glückswurf"><button class="btn small ghost" data-act="rollLuck" data-i="1">${DI} Würfeln</button><span class="dice">${C.luckDice[1]?dice(C.luckDice[1],'d6',ui.fresh==='luck1'):''}</span><span>Ergebnis: <b>${luck()??'–'}</b></span></div></div>`:'';
 const m=mov();
 return`<p class="lede">Junge Investigatoren sind kräftiger, ältere gebildeter. Wähle ein Alter zwischen 15 und 89; der Builder zeigt, was sich dadurch ändert.</p>
 <div class="row"><label for="age"><span class="lbl">Alter</span><input type="number" id="age" data-bind="age" data-num data-rr min="15" max="89" value="${esc(C.age)}" style="width:96px;font-size:20px"></label><div class="counter"><span>Altersgruppe</span><b>${B.lbl}</b></div>
  <button class="btn ghost" data-act="randAge">${DI} Alter würfeln</button>${C.ageDice?`<span class="rollnote">15 + 2W20: ${dice(C.ageDice,'d10',ui.fresh==='age')} = ${15+C.ageDice[0]+C.ageDice[1]}</span>`:''}</div>
 <p class="note" style="margin-top:6px">Gewürfelt wird 15 + 2W20 (17–55 Jahre). Dabei werden Altersabzüge zufällig verteilt und ein nötiger zweiter Glückswurf gleich mit erledigt.</p>
 <div class="block"><div class="tablewrap"><table class="bands"><thead><tr><th>Alter</th><th>Eigenschaften</th><th>BI-Proben</th><th>Sonstiges</th></tr></thead><tbody>${bandRows}</tbody></table></div></div>
 ${ded}${app||youth?`<div class="block"><h3>Weitere Änderungen</h3>${app}${youth}</div>`:''}${checks}${youthLuck}
 <div class="block"><h3>Bewegungsweite</h3><p>BW <b>${m??'–'}</b>${B.mov?` (Grundwert ${m+B.mov}, −${B.mov} durch Alter)`:''}.</p></div>
 ${rule('Bewegungsweite',`<p>Sind ST und GE beide kleiner als GR: BW 7. Sind beide größer als GR: BW 9. Sonst BW 8. Ab 40 Jahren sinkt die BW pro Jahrzehnt um 1.</p>`)}`}

function pickUI(sl,i,j){const p=(C.occPick[i]||[])[j]||'';const[f,s]=splitKey(p);
 let sel='';if(p){if(sl.opts.includes(p))sel=p;else if(sl.opts.includes(f+':*'))sel=f+':*'}
 const single=sl.opts.length===1;if(single)sel=sl.opts[0];
 const needsSpec=sel.endsWith(':*');const fam=needsSpec?sel.slice(0,-2):'';
 const select=single?`<span>${esc(SKM[fam].n)}:</span>`:`<select id="pk-${i}-${j}" data-sel="pick" data-i="${i}" data-j="${j}" aria-label="Fertigkeit wählen"><option value="">– wählen –</option>${sl.opts.map(o=>`<option value="${esc(o)}"${o===sel?' selected':''}>${esc(optLabel(o))}</option>`).join('')}</select>`;
 const spec=needsSpec?`<input id="sp-${i}-${j}" data-spec="${i}|${j}|${fam}" list="dl-${fam}" value="${esc(f===fam?s:'')}" placeholder="Spezialisierung, z. B. ${esc((SKM[fam].sugg||[''])[0])}" aria-label="Spezialisierung">`:'';
 return`<span class="pick">${select}${spec}</span>`}

function stepOcc(){const o=OCC[C.occ];
 const datalists=SK.filter(d=>d.spec).map(d=>`<datalist id="dl-${d.id}">${(d.sugg||[]).map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`).join('');
 const sel=`<label for="occSel"><span class="lbl">Beruf</span><select id="occSel" data-sel="occ"><option value="">– Beruf wählen –</option>${occIds().map(id=>`<option value="${id}"${id===C.occ?' selected':''}>${esc(OCC[id].n)}</option>`).join('')}</select></label>`;
 const nOcc=occIds().filter(id=>!OCC[id].custom).length;
 const rollBtn=`<button class="btn ghost" data-act="randOcc">${DI} Beruf würfeln (1W${nOcc})</button>`;
 if(!o)return`<p class="lede">Der Beruf bestimmt, worin dein Investigator ausgebildet ist und wie viel Geld er hat. Wähle aus der Liste, direkt eine Karte – oder lass die Würfel entscheiden.</p><div class="row" style="align-items:flex-end">${sel}${rollBtn}</div>
  <div class="occgrid block">${occIds().map(id=>`<button class="occbtn" data-act="pickOcc" data-o="${id}"><strong>${esc(OCC[id].n)}${OCC[id].era?'<span class="tag">Gegenwart</span>':''}</strong><span>${formulaLabel(OCC[id])}</span><span>Finanzkraft ${OCC[id].cr[0]}–${OCC[id].cr[1]}</span></button>`).join('')}</div>${occRule()}`;
 const alt=occAltChoice();
 const altSel=o.f.alt?`<label for="occAlt"><span class="lbl">Zweite Eigenschaft</span><select id="occAlt" data-sel="occAlt">${o.f.alt.map(k=>`<option value="${k}"${k===alt?' selected':''}>${CH[k].n} (${CH[k].a} ${final(k)??'–'} × 2 = ${(final(k)||0)*2})</option>`).join('')}</select></label>`:'';
 const sl=slots();
 const list=sl.map((s,i)=>{if(s.fixed)return`<li><span class="sn">${i+1}</span><div>${esc(skillName(s.fixed))}</div></li>`;
  const label=s.any?`${s.n} beliebige Fertigkeit${s.n>1?'en':''} nach Wahl`:s.lbl?`${s.n} ${s.n>1?'zwischenmenschliche Fertigkeiten':'zwischenmenschliche Fertigkeit'} (Charme, Einschüchtern, Überreden, Überzeugen)`:s.opts.length===1?`${SKM[s.opts[0].slice(0,-2)].n} – Spezialisierung wählen`:`${s.n>1?s.n+' aus':'Eine aus'}: ${s.opts.map(optLabel).join(' / ')}`;
  const picks=[];for(let j=0;j<s.n;j++)picks.push(pickUI(s,i,j));
  return`<li><span class="sn">${i+1}</span><div><div>${esc(label)}</div><div class="picks">${picks.join('')}</div></div></li>`}).join('');
 const dup=occDupes();
 return`<p class="lede">Der Beruf bestimmt, worin dein Investigator ausgebildet ist und wie viel Geld er hat.</p>${datalists}
 <div class="row" style="align-items:flex-end">${sel}${o.custom?field('occName','Bezeichnung','z. B. Fotograf'):''}${rollBtn}${C.occRoll&&!o.custom?`<span class="rollnote">1W${nOcc}: <span class="die d100${ui.fresh==='occ'?' fresh':''}">${C.occRoll}</span></span>`:''}</div>
 <div class="occdetail block"><h3 style="font-family:var(--head);font-size:26px;margin:0">${esc(occName())}</h3><p style="margin:4px 0 0">${esc(o.d)}</p>
  <div class="facts"><div class="fact"><span class="lbl">Formel</span><div>${formulaLabel(o)}</div></div>
   <div class="fact"><span class="lbl">Berufspunkte</span><b>${occTotal()}</b></div>
   <div class="fact"><span class="lbl">Finanzkraft</span><b>${o.cr[0]}–${o.cr[1]}</b></div></div>
  ${altSel?`<div style="margin-bottom:14px">${altSel}</div>`:''}
  <div class="row" style="justify-content:space-between;margin-bottom:4px"><span class="lbl" style="margin:0">Berufsfertigkeiten</span>${sl.some(s=>!s.fixed)?`<span class="row" style="gap:8px"><button class="btn small ghost" data-act="randPicks" data-all="0">${DI} Offene Auswahl würfeln</button><button class="btn small ghost" data-act="randPicks" data-all="1">Alle neu würfeln</button></span>`:''}</div>
  <ul class="slots">${list}<li><span class="sn">+</span><div>Finanzkraft <span class="note">(immer Berufsfertigkeit)</span></div></li></ul>
  ${dup.length?`<p class="warnline">Doppelt gewählt: ${dup.map(k=>esc(skillName(k))).join(', ')}. Wähle stattdessen eine andere Fertigkeit.</p>`:''}
 </div>
 <p class="note">Ein Berufswechsel setzt die bereits verteilten Berufspunkte zurück.</p>${occRule()}`}
function occRule(){return rule('Beruf',`<p>Jeder Beruf hat eine Formel für die Berufspunkte (meist BI × 4) und acht Berufsfertigkeiten. Wo eine Auswahl steht, entscheidest du. Finanzkraft gilt immer zusätzlich als Berufsfertigkeit und muss am Ende in der Spanne des Berufs liegen.</p>`)}

function ptsRow(k,pool,opts={}){const b=skillBase(k);const v=+C[pool+'Pts'][k]||0;const isOcc=occKeys().has(k);
 const dis=opts.disabled;
 return`<tr data-row="${esc(k)}" data-name="${esc(skillName(k).toLowerCase())}">
  <td>${esc(skillName(k))}${pool==='pers'&&isOcc?'<span class="tag" title="Berufsfertigkeit">Beruf</span>':''}${opts.extra||''}</td>
  <td class="num">${b}</td>
  ${pool==='pers'?`<td class="num">${occPart(k)||''}</td>`:''}
  <td class="num"><span class="stepper"><button data-act="pstep" data-pool="${pool}" data-k="${esc(k)}" data-d="-5" aria-label="${esc(skillName(k))} −5"${dis?' disabled':''}>−</button><input type="number" data-pts="${pool}|${esc(k)}" id="${pool}-${esc(k).replace(/[^a-z0-9]/gi,'_')}" min="0" value="${v||''}" placeholder="0" inputmode="numeric" aria-label="Punkte ${esc(skillName(k))}"${dis?' disabled':''}><button data-act="pstep" data-pool="${pool}" data-k="${esc(k)}" data-d="5" aria-label="${esc(skillName(k))} +5"${dis?' disabled':''}>+</button></span></td>
  <td class="num val" data-live="v:${esc(k)}"></td><td class="num" data-live="vh:${esc(k)}"></td><td class="num" data-live="vf:${esc(k)}"></td></tr>`}

function stepOccSkills(){if(!OCC[C.occ])return`<p class="lede">Wähle zuerst einen Beruf.</p><button class="btn" data-act="go" data-i="3">Zum Beruf</button>`;
 if(occIssues().length)return`<p class="lede">Die Berufswahl ist noch nicht vollständig: ${esc(occIssues()[0])}</p><button class="btn" data-act="go" data-i="3">Zurück zum Beruf</button>`;
 const [a,b]=crRange();
 const keys=[...occKeys()].sort((x,y)=>x==='finanzkraft'?1:y==='finanzkraft'?-1:skillName(x).localeCompare(skillName(y),'de'));
 return`<p class="lede">Verteile ${occTotal()} Berufspunkte auf die Fertigkeiten deines Berufs. Die Punkte kommen zum Basiswert hinzu.</p>
 <div class="sticky-counter"><div class="counter"><b data-live="occ-rem" data-sign></b><span>von ${occTotal()} Berufspunkten übrig</span></div><span class="note">Finanzkraft muss zwischen ${a} und ${b} liegen.</span></div>
 <div class="row" style="margin-bottom:12px"><button class="btn ghost small" data-act="randOccPts">${DI} Punkte zufällig verteilen</button><button class="btn ghost small" data-act="rollCR">${DI} Nur Finanzkraft würfeln (${a}–${b})</button><button class="linkbtn" data-act="resetPts" data-pool="occ">Alle Berufspunkte zurücksetzen</button></div>
 <div class="tablewrap"><table><thead><tr><th>Fertigkeit</th><th class="num">Basis</th><th class="num">Beruf</th><th class="num">Wert</th><th class="num">½</th><th class="num">⅕</th></tr></thead>
 <tbody>${keys.map(k=>ptsRow(k,'occ',{extra:k==='finanzkraft'?` <span class="note">(${a}–${b})</span>`:''})).join('')}</tbody></table></div>
 ${rule('Berufspunkte',`<p>Berufspunkte dürfen nur auf Berufsfertigkeiten verteilt werden. Kein Fertigkeitswert darf 99 übersteigen; viele Spielleitungen begrenzen Startwerte zusätzlich, etwa auf 75. Cthulhu-Mythos lässt sich nicht steigern.</p><p>Die Finanzkraft bestimmt Lebensstandard, Bargeld und Vermögen (Schritt 8).</p>`)}`}

function stepPers(){if(final('INT')==null)return`<p class="lede">Lege zuerst die Eigenschaften fest.</p>`;
 const keys=instances();const specFams=SK.filter(d=>d.spec&&okEra(d));
 return`<p class="lede">Mit ${persTotal()} Interessenpunkten (IN × 2) gestaltest du Hobbys und Eigenheiten. Sie dürfen auf jede Fertigkeit gehen, auch auf Berufsfertigkeiten.</p>
 <div class="sticky-counter"><div class="counter"><b data-live="pers-rem" data-sign></b><span>von ${persTotal()} Interessenpunkten übrig</span></div>
  <label for="skillSearch" style="flex:1;min-width:160px"><input id="skillSearch" type="search" placeholder="Fertigkeit suchen …" value="${esc(ui.search)}" style="width:100%"></label></div>
 <div class="row" style="margin-bottom:12px"><button class="btn ghost small" data-act="randPersPts">${DI} Punkte zufällig verteilen</button><button class="linkbtn" data-act="resetPts" data-pool="pers">Alle Interessenpunkte zurücksetzen</button><span class="note">Der Zufall setzt Schwerpunkte auf 5–8 Fertigkeiten.</span></div>
 <div class="tablewrap"><table><thead><tr><th>Fertigkeit</th><th class="num">Basis</th><th class="num">Beruf</th><th class="num">Interessen</th><th class="num">Wert</th><th class="num">½</th><th class="num">⅕</th></tr></thead>
 <tbody>${keys.map(k=>{const extra=C.extraSpecs.includes(k)&&!occKeys().has(k)&&!(+C.persPts[k])?` <button class="x" data-act="rmSpec" data-k="${esc(k)}" aria-label="Entfernen" title="Entfernen">×</button>`:'';
  return ptsRow(k,'pers',{disabled:k==='mythos',extra})}).join('')}</tbody></table></div>
 <div class="block"><h3>Spezialisierung hinzufügen</h3><p class="note">Etwa eine weitere Fremdsprache, ein Handwerk oder eine Wissenschaft.</p>
  <div class="row"><select id="specFam" aria-label="Fertigkeit">${specFams.map(d=>`<option value="${d.id}">${d.n}</option>`).join('')}</select>
  <input id="specName" list="dl-all-spec" placeholder="z. B. Französisch" aria-label="Spezialisierung"><datalist id="dl-all-spec">${[...new Set(specFams.flatMap(d=>d.sugg||[]))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <button class="btn small" data-act="addSpec">Hinzufügen</button><span class="note" id="specMsg"></span></div></div>
 ${rule('Persönliche Interessen',`<p>IN × 2 Punkte, frei verteilbar – außer auf Cthulhu-Mythos. Auch hier gilt: kein Wert über 99.</p>`)}`}

function stepBack(){return`<p class="lede">Der Hintergrund macht aus Zahlen eine Person. Schreib frei oder lass dir einen Vorschlag würfeln und pass ihn an.</p>
 <div class="row" style="margin-bottom:16px"><button class="btn ghost" data-act="randBack" data-all="0">${DI} Leere Felder würfeln</button><button class="btn ghost" data-act="randBack" data-all="1">Alle Felder neu würfeln</button></div>
 <div class="backgrid">${BACK.map(b=>`<div class="bfield"><div class="bfield-h"><label for="b-${b.k}"><span class="lbl" style="margin:0">${b.n}</span></label>

  <textarea id="b-${b.k}" data-bind="back.${b.k}" placeholder="${b.k==='scars'||b.k==='phobias'?'Meist zu Beginn leer – füllt sich im Spiel.':''}">${esc(C.back[b.k])}</textarea></div>`).join('')}</div>
 ${rule('Schlüsselverbindung',`<p>Markiere einen Eintrag als Schlüsselverbindung: das, was deinem Investigator am wichtigsten ist. Bei einem Anfall von Wahnsinn kann sie ihm Halt geben – oder genau sie zerbricht.</p>`)}`}

function stepMoney(){if(!OCC[C.occ])return`<p class="lede">Wähle zuerst einen Beruf; die Finanzen ergeben sich aus der Finanzkraft.</p>`;
 const cr=skillVal('finanzkraft');const f=finances(cr);
 const levels=era()==='modern'?[['0','Mittellos','10 $','keins','10 $'],['1–9','Arm','FK × 20','FK × 200','40 $'],['10–49','Durchschnittlich','FK × 40','FK × 1.000','200 $'],['50–89','Wohlhabend','FK × 100','FK × 10.000','1.000 $'],['90–98','Reich','FK × 400','FK × 40.000','5.000 $'],['99','Superreich','1 Mio. $','100 Mio. $+','100.000 $']]:[['0','Mittellos','0,50 $','keins','0,50 $'],['1–9','Arm','FK × 1','FK × 10','2 $'],['10–49','Durchschnittlich','FK × 2','FK × 50','10 $'],['50–89','Wohlhabend','FK × 5','FK × 500','50 $'],['90–98','Reich','FK × 20','FK × 2.000','250 $'],['99','Superreich','50.000 $','5 Mio. $+','5.000 $']];
 return`<p class="lede">Die Finanzkraft (${cr}) legt fest, wie dein Investigator lebt. ${era()==='modern'?'Werte gelten für die Gegenwart in heutigen US-Dollar.':'Werte gelten für die 1920er Jahre in US-Dollar.'}</p>

  <div class="fact counter" style="flex-direction:column;align-items:flex-start"><span>Bargeld</span><b>${f.cash}</b></div>
  <div class="fact counter" style="flex-direction:column;align-items:flex-start"><span>Vermögen</span><b>${f.assets}</b></div>
  <div class="fact counter" style="flex-direction:column;align-items:flex-start"><span>Ausgabenrahmen</span><b>${f.spend}</b></div></div>
 <div class="tablewrap"><table><thead><tr><th>Finanzkraft</th><th>Stand</th><th>Bargeld</th><th>Vermögen</th><th>Ausgaben</th></tr></thead><tbody>${levels.map(l=>`<tr class="${l[1]===f.lvl?'hl':''}">${l.map((c,i)=>`<td${i!==1?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="block"><h3>Ausrüstung & Besitz</h3><label for="gear" class="note">Was trägt dein Investigator bei sich, was besitzt er? Waffen, Werkzeug, Bücher, Wohnung, Auto …</label>
 <textarea id="gear" data-bind="gear" style="min-height:110px;margin-top:6px">${esc(C.gear)}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn ghost small" data-act="randGear">${DI} 4 Gegenstände würfeln</button><span class="note">Werden an die Liste angehängt.</span></div></div>
 ${rule('Ausgabenrahmen',`<p>Der Ausgabenrahmen ist der Betrag, den dein Investigator täglich ausgeben kann, ohne genauer Buch zu führen. Das Vermögen umfasst Besitz wie Haus, Auto oder Wertpapiere.</p>`)}`}

function sheetText(){const d=derived();const L=[];
 L.push((C.info.name||'Unbenannter Investigator').toUpperCase());
 L.push(`Epoche: ${ERA[era()]}`);
 L.push(`Beruf: ${occName()||'–'} · Alter: ${C.age} · Geschlecht: ${C.info.gender||'–'}`);
 L.push(`Wohnort: ${C.info.residence||'–'} · Geburtsort: ${C.info.birthplace||'–'}${C.info.player?' · Spieler/in: '+C.info.player:''}`);

const pick=a=>a[rnd(a.length)-1];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1)-1;[a[i],a[j]]=[a[j],a[i]]}return a}
function randomPerson(){const w=rnd(2)===1;C.info.gender=w?'weiblich':'männlich';
 const N=era()==='modern'?NAMES_M:NAMES;C.info.name=(rnd(100)<=15?'Dr. ':'')+pick(w?N.w:N.m)+' '+pick(NAMES.s);
 C.info.residence=pick(HOMES);C.info.birthplace=pick(BIRTH)}
function rollLuck(i){const r=[rnd(6),rnd(6),rnd(6)];C.luckDice[i]=r;C.luck[i]=r.reduce((x,y)=>x+y)*5}
function randomDed(){const B=band(C.age);B.keys.forEach(k=>C.ageDed[k]=0);if(!B.ded)return;const step=B.ded>=20?5:1;let rem=B.ded,guard=0;
 while(rem>0&&guard++<500){const k=pick(B.keys);const room=(+C.base[k]||0)-1-(+C.ageDed[k]||0);const add=Math.min(step,rem,room);if(add<=0)continue;C.ageDed[k]+=add;rem-=add}}
function randomAge(){const d=[rnd(20),rnd(20)];C.ageDice=d;C.age=15+d[0]+d[1];C.ageDed={STR:0,CON:0,DEX:0,SIZ:0};C.eduChecks=[];
 if(C.base.STR!=null)randomDed();if(band(C.age).youth&&C.luck[0]!=null&&C.luck[1]==null)rollLuck(1)}
function doEduCheck(){const B=band(C.age);const i=C.eduChecks.length;if(i>=B.checks||C.base.EDU==null)return;const cur=eduBefore(i);const r=rnd(100);C.eduChecks.push({roll:r,gain:r>cur?Math.min(rnd(10),99-cur):0})}
function randomOcc(){const ids=occIds().filter(id=>!OCC[id].custom);const n=rnd(ids.length);C.occ=ids[n-1];C.occRoll=n;C.occPick={};C.occPts={};C.occAlt=''}
function randomPicks(onlyEmpty){slots().forEach((s,i)=>{if(s.fixed)return;C.occPick[i]=C.occPick[i]||[];
 for(let j=0;j<s.n;j++){if(onlyEmpty&&validPick(C.occPick[i][j]))continue;C.occPick[i][j]='';const used=new Set(occKeyList());
  for(const o of shuffle(s.opts)){if(o.endsWith(':*')){const f=o.slice(0,-2);const sug=shuffle(SKM[f].sugg||[]).find(x=>!used.has(f+':'+x));if(sug){C.occPick[i][j]=f+':'+sug;break}}
   else if(!used.has(o)){C.occPick[i][j]=o;break}}}});pruneOcc()}
function spread(pool,keys,total){let rem=total;const P=C[pool+'Pts'];
 for(const cap of[75,99]){let guard=0;while(rem>0&&guard++<5000){const el=keys.filter(k=>skillVal(k)<cap);if(!el.length)break;const k=pick(el);const add=Math.min(rem,pick([5,5,10,10,15]),cap-skillVal(k));if(add<=0)continue;P[k]=(+P[k]||0)+add;rem-=add}if(rem<=0)break}
 return rem}

function randomOccPts(){if(occIssues().length)randomPicks(true);C.occPts={};const tot=occTotal();rollCR();
 if((C.occPts.finanzkraft||0)>tot)C.occPts.finanzkraft=tot;
 const keys=[...new Set(occKeyList())].filter(k=>k!=='finanzkraft'&&k!=='mythos');spread('occ',keys,tot-(C.occPts.finanzkraft||0))}

 if(rnd(10)<=4){const f=SKM.fremdsprache;const s=shuffle(f.sugg).find(x=>!instances().includes('fremdsprache:'+x));if(s)C.extraSpecs.push('fremdsprache:'+s)}
 const all=instances().filter(k=>k!=='mythos'&&k!=='finanzkraft');const focus=shuffle(all).slice(0,5+rnd(4));
 const rem=spread('pers',focus,persTotal());if(rem>0)spread('pers',all,rem)}
function randomBack(onlyEmpty){BACK.forEach(b=>{const l=backSugg(b);if(!l.length)return;if(onlyEmpty&&C.back[b.k].trim())return;C.back[b.k]=pick(l)});
 if(!C.keyConn)C.keyConn=pick(['people','places','items','ideo'])}
function randomGear(){const items=shuffle(era()==='modern'?GEAR_M:GEAR).slice(0,4).join(', ');C.gear=C.gear.trim()?C.gear.trim()+'\n'+items:items}
function randomAll(){const id=C.id;Object.assign(C,newChar(),{id,method:'roll',era:C.era});randomPerson();ORDER.forEach(rollChar);rollLuck(0);
 randomAge();for(let i=0;i<4;i++)doEduCheck();randomOcc();randomPicks(false);randomOccPts();randomPersPts();randomBack(false);randomGear();C.step=STEPS.length-1}

function notInEra(k,target){const d=SKM[splitKey(k)[0]];return!!(d&&d.era&&d.era!==target)}
function eraConflicts(target){const out=[];const o=OCC[C.occ];if(o&&o.era&&o.era!==target)out.push(`Beruf „${o.n}“`);
 const keys=new Set([...Object.keys(C.occPts),...Object.keys(C.persPts),...C.extraSpecs,...Object.keys(C.play&&C.play.gain||{}),...Object.values(C.occPick).flat().filter(Boolean)]);
 keys.forEach(k=>{if(notInEra(k,target))out.push(skillName(k))});return[...new Set(out)]}
function applyEra(target){const o=OCC[C.occ];if(o&&o.era&&o.era!==target){C.occ='';C.occPick={};C.occPts={};C.occAlt='';C.occRoll=null}
 for(const pool of[C.occPts,C.persPts,C.play&&C.play.gain,C.play&&C.play.ticks])if(pool)for(const k of Object.keys(pool))if(notInEra(k,target))delete pool[k];
 C.extraSpecs=C.extraSpecs.filter(k=>!notInEra(k,target));
 for(const i of Object.keys(C.occPick))C.occPick[i]=(C.occPick[i]||[]).map(p=>p&&notInEra(p,target)?'':p);
 C.era=target;pruneOcc()}

/* Die Leisten merken sich, von welchen Startwerten sie ausgehen (p.base). Ändert sich der Bogen,
   werden die aktuellen Werte um genau diese Differenz verschoben – erlittener Schaden bleibt erhalten. */
function ensurePlay(){if(!C.play||typeof C.play!=='object')C.play={};const p=C.play,d=derived();
 const start={hp:d.hp??0,mp:d.mp??0,san:d.san??0,luck:d.luck??0};
 if(!p.base||typeof p.base!=='object'){
  const bogus=['hp','mp','san','luck'].every(k=>!(+p[k]));          // alte Fassung: mit Nullen gespeichert
  p.base=bogus||p.hp==null?{hp:0,mp:0,san:0,luck:0}:{...start};
  for(const k of['hp','mp','san','luck'])if(p[k]==null||bogus)p[k]=0}
 if(p.sanDayStart!=null&&!(+p.base.san)&&start.san)p.sanDayStart=null;
 for(const k of['hp','mp','san','luck']){const diff=start[k]-(+p.base[k]||0);if(diff)p[k]=(+p[k]||0)+diff;p.base[k]=start[k]}
 p.hp=Math.max(0,Math.min(p.hp,start.hp));p.mp=Math.max(0,Math.min(p.mp,start.mp));p.san=Math.max(0,Math.min(p.san,99-skillVal('mythos')));p.luck=Math.max(0,Math.min(p.luck,99));
 if(p.sanDayStart==null)p.sanDayStart=p.san;if(p.sanToday==null)p.sanToday=0;
 for(const k of['ticks','cond','gain'])if(!p[k]||typeof p[k]!=='object')p[k]={};
 if(!Array.isArray(p.weapons))p.weapons=[newWeapon(PRESETS[0])];if(!Array.isArray(p.log))p.log=[];if(p.notes==null)p.notes='';
 return p}
function plog(text){const p=C.play;p.log.unshift({t:Date.now(),text});if(p.log.length>60)p.log.length=60}
function dbStr(){const x=dbBuild();return x?x.db:'0'}
function rollExpr(expr,opt={}){let s=String(expr||'').replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/([+-]?)SB/gi,(m,sg)=>{let v=dbStr().replace(/[−–]/g,'-');if(v==='0')return'+0';if(!/^[+-]/.test(v))v='+'+v;if(sg==='-')v=(v[0]==='+'?'-':'+')+v.slice(1);return v});
 if(!s)throw new Error('Gib einen Würfelausdruck ein, z. B. 1W6+2.');if(!/^[+-]/.test(s))s='+'+s;
 const re=/([+-])(\d*)[wd](\d+)|([+-])(\d+)/gi;let m,total=0,pos=0;const parts=[];
 while((m=re.exec(s))){if(m.index!==pos)break;pos=re.lastIndex;
  if(m[3]){const sg=m[1]==='-'?-1:1,n=+(m[2]||1),f=+m[3];if(n<1||n>50||f<2||f>1000)throw new Error('Zu viele oder ungültige Würfel.');
   const r=[];for(let i=0;i<n;i++)r.push(opt.max?f:rnd(f));total+=sg*r.reduce((a,b)=>a+b,0);parts.push(`${sg<0?'−':parts.length?'+':''}${n}W${f} [${r.join(', ')}]`)}
  else{const v=+m[5]*(m[4]==='-'?-1:1);total+=v;if(v)parts.push(`${v<0?'−':parts.length?'+':''}${Math.abs(v)}`)}}
 if(pos!==s.length)throw new Error('Diesen Ausdruck verstehe ich nicht. Beispiele: 1W6, 2W6+4, 1W3+SB.');
 return{total,text:parts.join(' ')||'0'}}
function d100(bp){const u=rnd(10)-1,n=1+Math.abs(bp),tens=[];for(let i=0;i<n;i++)tens.push((rnd(10)-1)*10);
 const vals=tens.map(t=>t+u===0?100:t+u);const roll=bp>0?Math.min(...vals):bp<0?Math.max(...vals):vals[0];
 return{roll,tens,u,usedTen:tens[vals.indexOf(roll)]}}
function levelOf(roll,t){if(roll===1)return 5;if(roll===100||(t<50&&roll>=96))return 0;if(roll<=fifth(t))return 4;if(roll<=half(t))return 3;if(roll<=t)return 2;return 1}
function thr(t,diff){return diff===2?t:diff===3?half(t):fifth(t)}

function makeRoll(spec,pushed){const p=C.play;const diff=spec.diff,bp=spec.bp;const d=d100(bp);const lv=levelOf(d.roll,spec.target);
 const r={spec,weapon:spec.weapon,label:spec.label,target:spec.target,diff,bp,...d,level:lv,success:lv===5||(lv>=diff&&lv!==0),pushed:!!pushed,notes:[]};
 const fam=spec.key?splitKey(spec.key)[0]:'';
 if(spec.malf&&d.roll>=spec.malf){r.success=false;r.notes.push('Fehlfunktion! Die Waffe hat Ladehemmung oder versagt.')}
 const usesLuck=['skill','char','attack'].includes(spec.kind);
 r.luckCost=d.roll-thr(spec.target,diff);
 r.canLuck=!r.success&&lv!==0&&!pushed&&usesLuck&&r.luckCost>0&&r.luckCost<=p.luck&&!r.notes.length;
 r.canPush=!r.success&&lv!==0&&!pushed&&(spec.kind==='char'||(spec.kind==='skill'&&!COMBAT.includes(fam)));
 if(r.success&&(spec.kind==='skill'||spec.kind==='attack')&&spec.key&&!NOTICK.includes(fam)){if(!p.ticks[spec.key])r.notes.push('Steigerungshäkchen gesetzt.');p.ticks[spec.key]=true}
 if(pushed&&!r.success)r.notes.push('Forcierte Probe gescheitert: Die Spielleitung bestimmt eine ernste Folge.');
 if(lv===0&&!pushed)r.notes.push('Patzer: Etwas geht richtig schief.');
 if(spec.kind==='san')sanAfterRoll(r);
 plog(`${r.label} (${spec.target}${diff>2?', '+DIFF[diff]:''}${bp?', '+(bp>0?'+':'')+bp+' '+(bp>0?'Bonus':'Malus'):''}${pushed?', forciert':''}) → ${d.roll}: ${LV[lv]}${r.success?'':' – nicht bestanden'}${r.sanText?' · '+r.sanText:''}`);
 ui.result=r;return r}
function startRoll(spec){spec.diff=spec.diff??ui.diff;spec.bp=spec.bp??ui.bp;ui.diff=2;ui.bp=0;makeRoll(spec,false);touch();renderPlay()}
function spendLuck(){const r=ui.result,p=C.play;if(!r||!r.canLuck)return;p.luck-=r.luckCost;r.success=true;r.level=r.diff;r.luckSpent=r.luckCost;r.canLuck=false;r.canPush=false;
 r.notes.push(`${r.luckCost} Glück eingesetzt – bestanden. Dafür gibt es kein Steigerungshäkchen.`);plog(`${r.label}: ${r.luckCost} Glück eingesetzt, jetzt bestanden`);touch();renderPlay()}

function applyDamage(n,src){const p=C.play,max=hpMax(),out=[];n=Math.max(0,Math.round(n));if(!n)return out;
 if(n>=max&&max>0){p.cond.dead=true;out.push(`Ein einzelner Treffer von ${n} Schaden erreicht die maximalen TP (${max}): Der Investigator ist tot.`)}
 else if(n>=Math.ceil(max/2)){p.cond.major=true;out.push(`Schwere Wunde (mindestens die Hälfte der max. TP). Würfle auf KO, sonst wird der Investigator bewusstlos.`)}
 p.hp=Math.max(0,p.hp-n);
 if(p.hp===0&&!p.cond.dead){if(p.cond.major){p.cond.dying=true;out.push('0 TP mit schwerer Wunde: Sterbend. Jede Runde eine KO-Probe; Erste Hilfe stabilisiert vorübergehend.')}else{p.cond.uncon=true;out.push('0 TP ohne schwere Wunde: Der Investigator ist bewusstlos.')}}
 plog(`${src||'Schaden'}: −${n} TP (jetzt ${p.hp}/${max})`);return out}
function heal(n,src){const p=C.play;n=Math.max(0,Math.round(n));p.hp=Math.min(hpMax(),p.hp+n);if(p.hp>0){p.cond.uncon=false}plog(`${src||'Heilung'}: +${n} TP (jetzt ${p.hp}/${hpMax()})`)}
function applySanLoss(n,src){const p=C.play,out=[];n=Math.max(0,Math.round(n));if(!n)return out;
 p.san=Math.max(0,p.san-n);p.sanToday+=n;
 if(n>=5)out.push(`${n} Stabilität auf einmal verloren: Würfle auf IN. Bei Erfolg begreift der Investigator das Grauen und wird vorübergehend wahnsinnig (1W10 Stunden).`);
 const lim=Math.max(1,fifth(p.sanDayStart));
 if(p.sanToday>=lim&&!p.cond.indefIns){p.cond.indefIns=true;out.push(`Heute insgesamt ${p.sanToday} Stabilität verloren (Grenze ${lim} = ⅕ des Tagesbeginns): unbestimmter Wahnsinn.`)}
 if(p.san===0){p.cond.permIns=true;out.push('Stabilität 0: Der Investigator ist dauerhaft wahnsinnig.')}
 plog(`${src||'Stabilitätsverlust'}: −${n} STA (jetzt ${p.san})`);return out}
function sanAfterRoll(r){const loss=(ui.sanLoss||'').trim();if(!loss)return;const[a,b]=loss.split('/');
 try{let n,t;if(r.level===0&&b!=null){n=rollExpr(b,{max:true}).total;t=`Patzer: maximaler Verlust ${n}`}
  else{const ex=r.success?(a||'0'):(b??a);const x=rollExpr(ex);n=x.total;t=/[wd]/i.test(ex)?`${r.success?'Bestanden':'Nicht bestanden'} – Verlust ${ex}: ${x.text} = ${n}`:`${r.success?'Bestanden':'Nicht bestanden'} – Verlust ${n}`}
  r.sanText=t;r.notes.push(t);const hs=applySanLoss(n,'Stabilitätsprobe');hs.forEach(h=>r.notes.push(h));if(hs.length)ui.hints=hs}catch(e){r.notes.push('Verlust nicht verstanden – bitte im Format 1/1W6 angeben.')}}
function devPhase(withLuck){const p=C.play,out=[];
 for(const k of Object.keys(p.ticks).filter(k=>p.ticks[k]).sort((a,b)=>skillName(a).localeCompare(skillName(b),'de'))){const v=skillVal(k),r=rnd(100);
  if(r>v||r>=96){const g=Math.min(rnd(10),99-v);if(g>0){p.gain[k]=(+p.gain[k]||0)+g;let line=`${skillName(k)}: W100 ${r} → +${g} (jetzt ${v+g})`;
    if(v<90&&v+g>=90){const s=rnd(6)+rnd(6);p.san=Math.min(sanMax(),p.san+s);line+=`. Meisterschaft: +${s} Stabilität`}out.push(line)}else out.push(`${skillName(k)}: schon bei 99`)}
  else out.push(`${skillName(k)}: W100 ${r} → keine Steigerung`)}
 if(!out.length)out.push('Keine Fertigkeit hatte ein Häkchen.');
 p.ticks={};
 if(withLuck){const r=rnd(100);if(r>p.luck){const g=Math.min(rnd(10),99-p.luck);p.luck+=g;out.push(`Glück: W100 ${r} → +${g} (jetzt ${p.luck})`)}else out.push(`Glück: W100 ${r} → keine Erholung`)}
 p.dev={at:Date.now(),lines:out};plog('Steigerungsphase durchgeführt');}

function numIn(id){const v=parseInt(document.getElementById(id)?.value,10);return Number.isFinite(v)&&v>0?v:0}
function weapon(id){return C.play.weapons.find(w=>w.id===id)}
function rollDamage(w,ext){const parts=String(w.dmg||'').split('/');const out=[];let first=null;
 try{parts.forEach((pt,i)=>{let txt,tot;if(ext){const mx=rollExpr(pt,{max:true}).total;if(w.imp){const ex=rollExpr(pt.replace(/[+-]\s*SB/i,''));tot=mx+ex.total;txt=`Maximum ${mx} + ${ex.text} = ${tot}`}else{tot=mx;txt=`Maximum ${mx}`}}else{const x=rollExpr(pt);tot=Math.max(0,x.total);txt=`${x.text} = ${tot}`}
  if(first==null)first=Math.max(0,tot);out.push((parts.length>1?['nah','mittel','weit'][i]+': ':'')+txt)});
  const note=ext?(w.imp?'Extremer Erfolg mit durchdringender Waffe: Maximalschaden plus ein weiterer Schadenswurf.':'Extremer Erfolg: Maximalschaden.'):'';
  plog(`${w.name}: Schaden ${out.join(' · ')}${ext?' (extrem)':''}`);
  ui.result={simple:true,label:`${w.name} – Schaden${parts.length>1?' (nah / mittel / weit)':''}`,total:first,text:out.join(' · '),notes:note?[note]:[]};
 }catch(e){ui.result=null;ui.hints=[`${w.name}: ${e.message}`]}}

const FORMAT='coc7-investigatoren';
function exportList(){return ui.scope==='all'?chars:[C]}
function exportData(){const list=exportList().map(clean);return JSON.stringify({format:FORMAT,version:1,exported:new Date().toISOString(),characters:list},null,1)}
function slug(s){return(s||'investigator').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,40)||'investigator'}
function exportName(){const d=new Date().toISOString().slice(0,10);return ui.scope==='all'?`investigatoren-${d}.json`:`${slug(C.info.name)}-${d}.json`}
function tmsg(k,t,cls=''){ui.tmsg={k,t,cls};const el=document.getElementById('tmsg-'+k);if(el){el.textContent=t;el.className='tmsg '+cls}}
function parseImport(text){let o;try{o=JSON.parse(String(text).trim())}catch(e){throw new Error('Das ist kein gültiges Datenformat. Kopiere die Daten vollständig, von der ersten { bis zur letzten }.')}
 let list=Array.isArray(o)?o:o&&Array.isArray(o.characters)?o.characters:o&&o.base?[o]:null;
 if(!list)throw new Error('In diesen Daten wurde kein Investigator gefunden.');
 list=list.filter(c=>c&&typeof c==='object'&&c.base&&c.info);if(!list.length)throw new Error('In diesen Daten wurde kein Investigator gefunden.');return list}
function mergeImport(list){let added=0,updated=0,same=0,first=null;
 for(const raw of list){const c=normalize(raw);if(!c.id)c.id=newChar().id;c.updated=Number.isFinite(+raw.updated)?+raw.updated:Date.now();c.touched=true;
  const i=chars.findIndex(x=>x.id===c.id);
  if(i<0){chars.push(c);added++;first=first||c;persist(c)}
  else if(c.updated>(+chars[i].updated||0)){chars[i]=c;updated++;first=first||c;persist(c)}
  else same++}
 chars.sort((a,b)=>b.updated-a.updated);if(first)C=first;lsWrite();
 const parts=[];if(added)parts.push(`${added} neu`);if(updated)parts.push(`${updated} aktualisiert`);if(same)parts.push(`${same} unverändert (hier schon gleich oder neuer)`);
 return{changed:added+updated,text:'Import: '+parts.join(', ')+'.'}}
function doImport(text,k){try{const r=mergeImport(parseImport(text));ui.tmsg={k,t:r.text,cls:r.changed?'ok':''};renderAll();return true}catch(e){tmsg(k,e.message,'err');return false}}
async function saveFile(){const data=exportData(),name=exportName();
 try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data});tmsg('save',`Gespeichert als ${name}.`,'ok');return}}}catch(e){if(e&&e.code)return tmsg('save','Die Datei wurde nicht gespeichert.','err')}
 try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  tmsg('save',`Gespeichert als ${name} (meist im Download-Ordner).`,'ok')}catch(e){tmsg('save','Speichern ging hier nicht. Nutze „Daten kopieren“.','err')}}
async function loadFiles(files){files=[...(files||[])];if(!files.length)return;let all=[],bad=0;
 for(const f of files){try{all=all.concat(parseImport(await f.text()))}catch(e){bad++}}
 if(!all.length)return tmsg('load',files.length>1?'Keine der Dateien enthält Investigatoren-Daten.':'Diese Datei enthält keine Investigatoren-Daten.','err');
 const r=mergeImport(all);ui.tmsg={k:'load',t:r.text+(bad?` ${bad} Datei${bad>1?'en':''} übersprungen.`:''),cls:r.changed?'ok':''};renderAll()}
async function copyData(){const data=exportData();const n=exportList().length;
 try{await navigator.clipboard.writeText(data);tmsg('copy',`${n===1?'Investigator':n+' Investigatoren'} kopiert. Auf dem anderen Gerät hier einfügen.`,'ok')}
 catch(e){const ta=document.getElementById('pasteBox');ta.value=data;ta.focus();ta.select();tmsg('copy','Daten im Feld markiert – kopiere sie mit Strg/⌘ + C.')}}

async function copy(text,msg){try{await navigator.clipboard.writeText(text);ui.copied=msg}catch(e){const ta=document.getElementById('exportBox');ta.value=text;ta.focus();ta.select();ui.copied='Text markiert – kopiere ihn mit Strg/⌘ + C.'}const m=document.getElementById('copyMsg');if(m)m.textContent=ui.copied}

 case'dedEven':{const B=band(C.age);const n=B.keys.length;B.keys.forEach((x,i)=>C.ageDed[x]=Math.floor(B.ded/n)+(i<B.ded%n?1:0));touch();renderMain();refreshLive();return}
 case'eduCheck':{const B=band(C.age);const i=C.eduChecks.length;if(i>=B.checks)return;const cur=eduBefore(i);const r=rnd(100);C.eduChecks.push({roll:r,gain:r>cur?Math.min(rnd(10),99-cur):0});touch();renderMain();refreshLive();return}
 case'eduReset':C.eduChecks=[];touch();renderMain();refreshLive();return;

 case'addSpec':{const fam=document.getElementById('specFam').value;const name=document.getElementById('specName').value.trim().replace(/:/g,' ');const msg=document.getElementById('specMsg');
  if(!name){msg.textContent='Gib eine Spezialisierung ein.';return}const key=fam+':'+name;if(instances().includes(key)){msg.textContent=skillName(key)+' gibt es schon.';return}

 if(s==='occ'){C.occ=t.value;C.occPick={};C.occPts={};C.occAlt='';touch();renderAll();return}
 if(s==='occAlt'){C.occAlt=t.value;touch();renderMain();refreshLive();return}
 if(s==='pick'){const i=t.dataset.i,j=+t.dataset.j;C.occPick[i]=C.occPick[i]||[];const v=t.value;C.occPick[i][j]=v.endsWith(':*')?v.slice(0,-1):v;pruneOcc();touch();renderMain();refreshLive();return}
});

['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(!z)return;e.preventDefault();z.classList.add('over')}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(!z)return;e.preventDefault();z.classList.remove('over');loadFiles(e.dataTransfer.files)});

setStatus('Wird geladen …');
renderAll();
initStore();
</script>
